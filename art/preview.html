<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="../" />
  <title>Oathbound — Art Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #100e16; color: #eee4d0; font: 15px system-ui, sans-serif; }
    header { max-width: 1120px; padding: 30px 24px 18px; margin: auto; }
    h1 { color: #d4b06a; font: bold 30px Georgia, serif; letter-spacing: .08em; margin: 0 0 8px; }
    p { color: #aaa1af; margin: 8px 0 16px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    select, button, a { border: 1px solid #615039; background: #241c2a; color: #e1c88c; padding: 8px 12px; font: inherit; text-decoration: none; }
    label { display: flex; align-items: center; gap: 8px; }
    #gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); max-width: 1120px; margin: auto; padding: 0 24px 32px; gap: 14px; }
    article { border: 1px solid #403449; background: radial-gradient(ellipse at 50% 70%, #2f2931, #17131e 80%); text-align: center; }
    canvas { width: 100%; height: 210px; display: block; }
    h2 { font: 18px Georgia, serif; color: #d4b06a; margin: 0 0 6px; }
    article p { font-size: 12px; margin: 0 0 16px; }
  </style>
</head>
<body>
  <header>
    <h1>OATHBOUND · Art Gallery</h1>
    <p>The knights and creatures of the Last Vigil.</p>
    <nav>
      <label>Motion <select id="clip"><option>idle</option><option selected>run</option><option>dash</option><option>hurt</option><option>death</option><option>tel</option><option>go</option><option>slam</option><option>cast</option></select></label>
      <label>Facing <select id="direction"><option>south</option><option>east</option><option>north</option><option>west</option></select></label>
      <button id="pause">Pause</button>
      <a href="index.html">Play Oathbound</a>
    </nav>
  </header>
  <main id="gallery"></main>
  <script>
    const names = { aldric: 'Sir Aldric', mara: 'Sister Mara', hollow: 'The Hollow', skeleton: 'Skeleton', slime: 'Slime', bat: 'Bat', wight: 'Wight', shade: 'Shade', golem: 'Golem', duke: 'The Wailing Duke', hydra: 'Bone Hydra', dawneater: 'The Dawn Eater' };
    let time = 0, last = 0, paused = false;
    const cards = [];
    document.getElementById('pause').onclick = event => { paused = !paused; event.target.textContent = paused ? 'Resume' : 'Pause'; };
    fetch('assets/asset-manifest.json').then(r => r.json()).then(async manifest => {
      for (const [name, title] of Object.entries(names)) {
        const spec = manifest.actors[name];
        if (!spec) continue;
        const card = document.createElement('article');
        card.innerHTML = `<canvas width="450" height="420"></canvas><h2>${title}</h2><p class="motion"></p>`;
        document.getElementById('gallery').appendChild(card);
        const image = new Image(); image.src = spec.src;
        await image.decode();
        cards.push({ canvas: card.querySelector('canvas'), label: card.querySelector('.motion'), spec, image });
      }
      window.galleryReady = true;
      requestAnimationFrame(draw);
    });
    function draw(now) {
      if (!paused) time += Math.min(.05, (now - last) / 1000 || .016);
      last = now;
      const desired = document.getElementById('clip').value;
      const facing = document.getElementById('direction').value;
      for (const card of cards) {
        const { spec, image, canvas, label } = card;
        const clipName = spec.clips[desired] ? desired : 'idle';
        const clip = spec.clips[clipName];
        const direction = clip.directions[facing] ? facing : facing === 'west' ? 'west' : 'east';
        const frames = clip.directions[direction] || Object.values(clip.directions)[0];
        const u = clip.loop ? time / clip.duration % 1 : Math.min(1, time % (clip.duration + .6) / clip.duration);
        const frame = frames[Math.min(frames.length - 1, Math.floor(u * frames.length))];
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(225, 365, 66, 13, 0, 0, Math.PI * 2); ctx.fill();
        const scale = 265 / spec.bodyPixels;
        ctx.drawImage(image, ...frame, 225 - spec.anchor[0] * scale, 365 - spec.anchor[1] * scale, frame[2] * scale, frame[3] * scale);
        label.textContent = clipName + ' · ' + direction;
      }
      requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
